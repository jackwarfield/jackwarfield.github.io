# ---------------------------------------------------------------------------
# Publications
#
# To add a paper by hand, copy an entry below and edit it. Only `title`,
# `authors`, `year`, and `category` are required. Everything else is optional
# and is simply omitted from the page if you leave it out.
#
#   title      Paper title, no trailing period.
#   authors    List of names in order. Any name containing the string set by
#              `author_highlight` in _config.yml (default "Warfield") is
#              rendered in bold automatically.
#   year       Publication year.
#   journal    Journal abbreviation, e.g. ApJ, AJ, MNRAS, ApJS.
#   volume     Volume number.
#   page       Page or article number.
#   preprint   arXiv identifier, e.g. 2510.24849.
#   status     Free text badge: "accepted to ApJ", "submitted to AJ", etc.
#   bibcode    ADS bibcode. Used to build the ADS link.
#   doi        DOI, if you want a publisher link as well.
#   links      Extra links: - {label: Code, url: "..."}
#   category   Which section it appears in. Must match an id under
#              `categories` below.
#
# Or run:  python3 scripts/add_publication.py 2025arXiv251024849W
# which fetches the metadata from ADS and appends a filled-in entry for you.
# ---------------------------------------------------------------------------

categories:
  - id: first
    title: First-author and highlighted contributions
  - id: observing
    title: Highlighted observing programs
    footer_text: Link to full list
    footer_url: "https://ui.adsabs.harvard.edu/search/filter_bibstem_facet_fq_bibstem_facet=OR&filter_bibstem_facet_fq_bibstem_facet=bibstem_facet%3A%22jwst.prop%22&filter_bibstem_facet_fq_bibstem_facet=bibstem_facet%3A%22hst..prop%22&fq=%7B!type%3Daqp%20v%3D%24fq_database%7D&fq=%7B!type%3Daqp%20v%3D%24fq_bibstem_facet%7D&fq_bibstem_facet=(bibstem_facet%3A%22jwst.prop%22%20OR%20bibstem_facet%3A%22hst..prop%22)&fq_database=(database%3Aastronomy%20OR%20database%3Aphysics)&p_=0&q=author%3A%22Warfield%2C%20Jack%22%20year%3A2017-&sort=date%20desc%2C%20bibcode%20desc"
  - id: other
    title: Other publications

