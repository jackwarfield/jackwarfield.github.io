---
layout: default
title: Home
---
<section class="hero">
  <img class="hero-photo" src="{{ site.photo }}" alt="{{ site.photo_alt }}" width="380" height="380">

  <div>
    <h1>{{ site.name }}</h1>
    <p class="role">{{ site.role }}<br>{{ site.affiliation }}</p>
    <p class="tagline">{{ site.tagline }}</p>

    <div class="actions">
      <!--<a class="btn btn-primary" href="/research/">Research</a>-->
      <a class="btn" href="/publications/">Publications</a>
      <a class="btn" href="{{ site.cv }}">CV (PDF)</a>
      <a class="btn" href="mailto:{{ site.email }}">Email</a>
    </div>
  </div>
</section>

<dl class="facts">
  {% for fact in site.facts %}
  <div>
    <dt>{{ fact.label }}</dt>
    <dd>{{ fact.value }}</dd>
  </div>
  {% endfor %}
</dl>
