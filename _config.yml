name: Jack Warfield
title: Jack Warfield
role: Postdoctoral Scholar
affiliation: Department of Astronomy, University of California, Berkeley
tagline: >-
  I study the dynamics and stellar populations of dwarf galaxies in the
  Local Group using observations from observatories such as HST, JWST, Gaia,
  and Euclid.
description: >-
  Jack Warfield is a postdoctoral researcher in the Department of Astronomy at
  UC Berkeley, working on understanding the dynamics and stellar populations of
  Local Group dwarf galaxies.

url: https://jackwarfield.com
email: warfield@berkeley.edu
photo: /images/jack-at-aas.jpg
photo_alt: Jack Warfield speaking at AAS 241 in Seattle, January 2023.
cv: /docs/JackWarfield_CV_Aug2026.pdf

# Short facts shown on the home page. Add, remove, or reorder freely.
facts:
  - label: Location
    value: Berkeley, CA
  - label: Research Interests
    value: The local universe, dwarf galaxies, galaxy dynamics, stellar populations
  - label: Other Interests
    value: College football, climbing

